
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2nd Quarter | Drill 2</title>


    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 16px;
            font-family: 'Nunito', sans-serif;
            color: #385548;
            background:
                radial-gradient(circle at 10% 15%, #fff1b8 0, transparent 18%),
                radial-gradient(circle at 90% 20%, #e2d5ff 0, transparent 20%),
                radial-gradient(circle at 15% 90%, #c8f0d5 0, transparent 23%),
                linear-gradient(135deg, #f3ffe9, #e8f0ff, #fff0f5);
            background-attachment: fixed;
        }

        .container {
            position: relative;
            max-width: 650px;
            margin: 35px auto;
            padding: 35px;
            background: rgba(255, 255, 255, 0.92);
            border: 3px solid white;
            border-radius: 28px;
            box-shadow: 0 12px 0 #d5e8d7,
                        0 20px 40px rgba(78, 112, 94, 0.15);
            animation: appear 0.6s ease-out;
        }

        .container::before {
            content: '✿';
            position: absolute;
            top: -24px;
            left: 22px;
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            color: white;
            background: #f6a9c5;
            border: 4px solid white;
            border-radius: 50%;
            font-size: 27px;
            transform: rotate(-15deg);
        }

        .container::after {
            content: '✦';
            position: absolute;
            top: 16px;
            right: 23px;
            color: #f3c75b;
            font-size: 35px;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        h3 {
            margin: 12px 30px;
            color: #397455;
            font-family: 'Fredoka', sans-serif;
            font-size: 30px;
            font-weight: 600;
            text-align: center;
        }

        .subtitle {
            margin: 0 auto 25px;
            color: #82978a;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .form-label {
            margin-bottom: 7px;
            color: #50735e;
            font-size: 14px;
            font-weight: 800;
        }

        .form-control {
            min-height: 45px;
            padding: 11px 14px;
            border: 2px solid #e0ecdf;
            border-radius: 13px;
            background: #fbfff9;
            color: #385548;
            font-family: 'Nunito', sans-serif;
            transition: 0.2s ease;
        }

        .form-control::placeholder {
            color: #b1c0b4;
        }

        .form-control:focus {
            border-color: #8ac99b;
            box-shadow: 0 0 0 4px rgba(138, 201, 155, 0.2);
        }

        .btn-primary {
            width: 100%;
            min-height: 46px;
            margin-top: 5px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #68b984, #43996c);
            box-shadow: 0 4px 0 #337c55;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 17px;
            transition: 0.2s ease;
        }

        .btn-primary::after {
            content: ' ✧';
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #7bca94, #4ca576);
            color: white;
            transform: translateY(-2px);
        }

        #output {
            margin-top: 25px;
            padding: 20px;
            border: 2px dashed #b9dabe;
            border-radius: 18px;
            background: linear-gradient(135deg, #f5fff3, #f3f0ff);
            color: #466653;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        #output:empty {
            display: none;
        }

        .member-heading {
            margin-bottom: 6px;
            color: #397455;
            font-size: 15px;
            font-weight: 800;
        }

        .member-list {
            font-size: 13px;
            line-height: 1.65;
        }

        .member-total {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #b9dabe;
            color: #397455;
            font-size: 13px;
            font-weight: 800;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes twinkle {
            from {
                transform: rotate(0deg) scale(0.9);
            }

            to {
                transform: rotate(18deg) scale(1.1);
            }
        }

        /* Adjusts the layout for smaller screens */
        @media (max-width: 576px) {
            body {
                padding: 15px 10px;
            }

            .container {
                margin: 25px auto;
                padding: 28px 19px;
                border-radius: 23px;
            }

            h3 {
                margin: 15px 10px;
                font-size: 26px;
            }

            .container::after {
                right: 13px;
                font-size: 27px;
            }
        }

        /* Turns off animations when reduced motion is preferred */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h3>Add New Club Member</h3>

        <p class="subtitle">
            Enter the member's first and last name to add them to the club directory.
        </p>

        <!-- Form for entering a new member into the club -->
        <form class="mb-4" onsubmit="return false;">
            <div class="mb-3">
                <label for="first_name" class="form-label">First Name</label>
                <input
                    type="text"
                    id="first_name"
                    class="form-control"
                    placeholder="Enter the first name"
                    autocomplete="given-name"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="last_name" class="form-label">Last Name</label>
                <input
                    type="text"
                    id="last_name"
                    class="form-control"
                    placeholder="Enter the last name"
                    autocomplete="family-name"
                    required
                >
            </div>

            <!-- Runs the Python function when clicked -->
            <button
                type="button"
                py-click="result_checker"
                class="btn btn-primary"
            >
                Add Club Member
            </button>
        </form>

        <!-- Python displays the member list and total here -->
        <div id="output" aria-live="polite"></div>
    </main>

    <!-- Loads the Python program -->
    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
